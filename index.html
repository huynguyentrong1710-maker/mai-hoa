function score(){return Math.min(99,68+state.mealLogs.length*4+Object.keys(state.devices).length*3)}
function nutrition(food){const o=state.overrides[food[0]];return o?{cal:o.cal,protein:o.protein,carb:o.carb,fat:o.fat}:{cal:food[1],protein:food[2],carb:food[3],fat:food[4]}}
function getFood(name){return foodBase.find(f=>f[0]===name)||foodBase[0]}
function profileCalc(){if(!state.user)return null;const p=state.user;const bmi=p.weight/Math.pow(p.height/100,2);const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161);const activity=({low:1.2,light:1.375,medium:1.55,high:1.725})[p.activity]||1.2;const tdee=bmr*activity;const target=Math.max(1000,Math.round((tdee+(p.goal==='lose'?-300:p.goal==='gain'?300:0))/10)*10);return {bmi:bmi.toFixed(1),bmr:Math.round(bmr),tdee:Math.round(tdee),target,protein:Math.round(target*.27/4),carb:Math.round(target*.48/4),fat:Math.round(target*.25/9)}}

luetooth, chữ ký số, thanh toán hoặc bảo mật vận hành đúng trên hạ tầng sản xuất.</div></div></div>`}

function requireRole(role){if(state.role!==role){toast(`Chuyển sang vai trò ${roleNames[role]} để thao tác.`,'warn');return false}return true}

function scan(){if(!requireRole('user')||!requireMod('ai')||!requireMod('db'))return;if(!state.importedCount){toast('Hãy nạp dữ liệu thực phẩm demo trước.','warn');return}const name=document.getElementById('scanFood').value;const f=getFood(name),n=nutrition(f);state.lastScan={name,...n};log('AI Scanner phân tích mẫu: '+name);saveStep('Đã tạo kết quả phân tích demo cho '+name)}
function fridgeAdd(v){if(!requireRole('user')||!requireMod('db'))return false;if(!state.premium&&state.fridge.length>=state.limits.free){log('Giới hạn 7 sản phẩm: đã chặn sản phẩm thứ '+(state.fridge.length+1),'fail');toast(`Đã đạt giới hạn ${state.limits.free} sản phẩm của Freemium. Nâng cấp Premium để thêm.`, 'warn');return false}if(new Date(v.exp+'T12:00:00')<new Date(v.mfg+'T12:00:00')){toast('Hạn sử dụng phải bằng hoặc sau ngày sản xuất / mua.','bad');return false}state.fridge.push({...v,id:'f'+Date.now()+Math.random().toString(36).slice(2,7)});log('Tủ lạnh: thêm '+v.name);save();return true}
function fillSeven(){if(!requireRole('user')||!requireMod('db'))return;const n=state.limits.free;for(let i=state.fridge.length;i<Math.min(n,7);i++){const s=sampleItems[i];state.fridge.push({name:s[0],qty:1,mfg:today(),exp:plusDays(s[1]),notify:2,id:'f'+Date.now()+i})}log('Nạp nhanh bộ 7 thực phẩm demo');saveStep('Đã nạp dữ liệu tủ lạnh để thử luồng Freemium')}
function storageTip(f){let n=f.name.toLowerCase(),msg;if(n.includes('gà')||n.includes('bò')||n.includes('thịt')||n.includes('cá'))msg='Sơ chế: tách dụng cụ dùng cho thực phẩm sống, rửa tay sau tiếp xúc; không rửa thịt sống dưới vòi nước. Bảo quản lạnh khoảng 0–4°C, để hộp kín ở ngăn dưới cùng; đông lạnh ở −18°C nếu cần để lâu. Tuân thủ hạn bảo quản và hướng dẫn trên nhãn.';else if(n.includes('trứng'))msg='Giữ trứng trong hộp tại ngăn mát theo chỉ dẫn trên bao bì, tránh thay đổi nhiệt độ liên tục. Nấu chín phù hợp, loại bỏ quả nứt hoặc có mùi lạ.';else if(n.includes('sữa'))msg='Bảo quản theo nhãn; sau khi mở, giữ ở ngăn mát khoảng 0–4°C nếu sản phẩm yêu cầu. Đậy kín và sử dụng trong khoảng thời gian nhà sản xuất hướng dẫn.';else if(n.includes('gạo'))msg='Để gạo khô trong hộp kín, nơi mát, sạch, tránh ẩm và côn trùng. Với cơm đã nấu, làm nguội nhanh rồi bảo quản lạnh, không để ở nhiệt độ phòng lâu.';else msg='Loại bỏ phần hỏng, rửa/sơ chế trước khi nấu, giữ trong hộp/túi sạch. Với rau củ cần làm mát, thường bảo quản ngăn mát khoảng 0–4°C; ưu tiên hướng dẫn cụ thể trên bao bì.';return `<div class="callout"><b>${esc(f.name)}</b><p style="margin:7px 0">${msg}</p><small>Hướng dẫn mô phỏng dựa trên nhóm thực phẩm, không thay thế hướng dẫn an toàn chuyên biệt.</small></div>`}
function createRecipe(){if(!requireRole('user')||!requireMod('ai'))return;if(!state.fridge.length){toast('Cần có nguyên liệu trong tủ lạnh để gợi ý thực đơn.','warn');return}const names=state.fridge.map(f=>f.name.toLowerCase());const sorted=[...state.fridge].sort((a,b)=>daysUntil(a.exp)-daysUntil(b.exp));const urgent=sorted.filter(f=>daysUntil(f.exp)<=Math.max(3,f.notify));let best=demoRecipes.map(r=>({r,hits:r.needs.filter(n=>names.some(nm=>nm.includes(n))).length})).sort((a,b)=>b.hits-a.hits)[0];const recipe=best.r,missing=recipe.needs.filter(n=>!names.some(x=>x.includes(n)));const priority=urgent.length?urgent:sorted.slice(0,2);const all=[...missing.map(x=>x.charAt(0).toUpperCase()+x.slice(1)),...recipe.extra];const list=[...new Set(all)].filter(x=>!names.some(n=>n.includes(x.toLowerCase())));state.lastRecipe=`<div class="grid cols2"><div class="callout"><b>🍽️ Gợi ý: ${esc(recipe.name)}</b><p class="sub">Gợi ý dựa trên từ khóa tên thực phẩm có trong tủ (mô phỏng).</p><b>Ưu tiên dùng trước</b><div class="sub">${priority.map(x=>esc(x.name)+' (HSD '+dateLocal(x.exp)+')').join(' · ')}</div><div style="height:9px"></div><b>Nguyên liệu hiện có</b><div class="sub">${state.fridge.map(x=>esc(x.name)).join(', ')}</div></div><div class="callout neutral"><b>🛒 Danh sách mua sắm cần bổ sung</b>${list.length?`<ul class="checklist">${list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>Không cần mua thêm nguyên liệu cho công thức demo này.</p>'}<p class="hint">Không dùng thực phẩm quá hạn hoặc có dấu hiệu hư hỏng.</p></div></div>`;log('Gợi ý thực đơn từ '+state.fridge.length+' thực phẩm');save();document.getElementById('recipeOutput').innerHTML=state.lastRecipe;toast('Đã lập thực đơn và danh sách mua sắm mẫu')}
function miuAnswer(q){const s=q.toLowerCase();if(s.includes('protein')||s.includes('đạm'))return 'Protein có trong trứng, cá, thịt, đậu và sữa. Hãy cân đối lượng đạm theo tổng năng lượng và nhu cầu cá nhân; số liệu ứng dụng này chỉ là ước tính.';if(s.includes('calo')||s.includes('kcal'))return 'Bạn có thể lập hồ sơ để xem TDEE và mức calo tham khảo. Nhu cầu thực tế còn phụ thuộc vận động, tình trạng sức khỏe và mục tiêu.';if(s.includes('phở'))return 'Một khẩu phần phở bò tham khảo trong cơ sở dữ liệu demo là '+nutrition(getFood('Phở bò')).cal+' kcal. Khẩu phần, nước dùng và lượng thịt có thể làm con số thay đổi.';if(s.includes('bảo quản')||s.includes('tủ lạnh'))return 'Hãy theo dõi hạn sử dụng, giữ thực phẩm sống tách biệt thực phẩm chín và tuân thủ hướng dẫn nhiệt độ trên nhãn. Tủ lạnh demo có tính năng nhắc trước hạn.';if(s.includes('tăng cơ')||s.includes('giảm cân'))return 'Bạn nên đặt mục tiêu năng lượng phù hợp, đảm bảo protein, vận động và theo dõi tiến độ. Mô hình này chỉ đưa khuyến nghị minh họa, không thay thế chuyên gia.';return 'Mình có thể minh họa câu trả lời về protein, calo, món phở, giảm cân/tăng cơ và bảo quản thực phẩm. Trong bản demo, mình trả lời theo quy tắc, chưa kết nối mô hình AI thật.'}

function exportFoodCsv(){if(!state.importedCount)return toast('Cần import dữ liệu mẫu trước.','warn');const records=generatedFoodRecords(),rows=[['Mã demo','Tên món cơ sở','Khẩu phần mô phỏng','Kcal','Protein g','Carb g','Fat g'],...records.map(x=>[x.code,x.name,x.portion,x.cal,x.protein,x.carb,x.fat])];const csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='themeal-5120-mock-records.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Đã tạo file CSV chứa 5.120 dòng biến thể demo')}

document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t){state.tab=t.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});return}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;
if(a==='goto-setup'||a==='goto-tests'){state.tab=a==='goto-setup'?'setup':'tests';render();window.scrollTo(0,0)}
else if(a==='setup-all'){Object.keys(state.modules).forEach(x=>state.modules[x]=true);state.importedCount=5120;state.limits={free:7,platform:10,commission:2};log('Đã khởi tạo 5 phân hệ và 5.120 bản ghi mẫu');saveStep('Cài đặt môi trường sandbox thành công')}
else if(a==='import'){state.importedCount=5120;log('Nạp 5.120 bản ghi ảo (32 món cơ sở × 160 khẩu phần mã)');saveStep('Đã nạp 5.120 biến thể mẫu (giả lập)')}
else if(a==='scan')scan();
else if(a==='save-meal'){if(!requireRole('user')||!state.lastScan)return;state.mealLogs.unshift({...state.lastScan,time:new Date().toISOString(),id:Date.now()});log('Lưu nhật ký bữa ăn '+state.lastScan.name);saveStep('Đã lưu bữa ăn và cập nhật Health Score mô phỏng')}
else if(a==='report-food'){if(!state.lastScan)return toast('Vui lòng phân tích món ăn trước.','warn');state.reports.push({id:'report-'+Date.now(),food:state.lastScan.name,note:'Người dùng báo kết quả AI Scanner có thể không chính xác',status:'pending'});log('Gửi báo cáo AI Scanner: '+state.lastScan.name);saveStep('Đã gửi báo cáo đến Admin')}
else if(a==='pair'){if(!requireRole('user')||!requireMod('iot'))return;state.devices[id]=true;log('Đồng bộ chỉ số ảo từ '+id);saveStep('Đã kết nối thiết bị ảo (không phải Bluetooth thực)')}
else if(a==='premium'){if(!requireRole('user'))return;if(state.premium&&state.fridge.length>state.limits.free){toast('Hãy giảm số sản phẩm về giới hạn Free trước khi hạ gói.','warn');return}state.premium=!state.premium;log(state.premium?'Nâng gói Premium giả lập':'Chuyển về Freemium');saveStep('Đã cập nhật gói dịch vụ demo')}
else if(a==='fill-seven')fillSeven();
else if(a==='try-eighth'){if(fridgeAdd({name:'Sản phẩm thứ 8',qty:1,mfg:today(),exp:plusDays(3),notify:2})){saveStep('Đã thêm sản phẩm thử nghiệm (chưa đủ giới hạn để chặn)')}}
else if(a==='remove-fridge'){if(!requireRole('user'))return;let food=state.fridge.find(x=>x.id===id);state.fridge=state.fridge.filter(x=>x.id!==id);log('Xóa thực phẩm '+(food?.name||''));saveStep('Đã xóa khỏi tủ lạnh')}
else if(a==='storage'){const f=state.fridge.find(x=>x.id===id);if(!f)return;const h=document.createElement('div');h.className='toast';h.style.maxWidth='400px';h.innerHTML=storageTip(f);document.getElementById('toasts').append(h);setTimeout(()=>h.remove(),9000)}
else if(a==='recipe')createRecipe();
else if(a==='approve-expert'){if(!requireRole('admin'))return;state.expert.status='approved';log('Admin phê duyệt chuyên gia '+state.expert.name);saveStep('Hồ sơ được duyệt. Hợp đồng demo đã sẵn sàng để ký')}
else if(a==='reject-expert'){if(!requireRole('admin'))return;state.expert.status='none';state.expert.signed=false;log('Admin từ chối hồ sơ chuyên gia');saveStep('Đã từ chối hồ sơ chuyên gia')}
else if(a==='enroll'){if(!requireRole('user')||!requireMod('sign'))return;if(state.enrollments.find(x=>x.courseId===id)){toast('Học viên đã bắt đầu đăng ký khóa học này.','warn');return}state.enrollments.push({id:'e'+Date.now(),courseId:id,signed:false,paid:false,fee:0});log('Tạo hợp đồng 3 bên cho khóa học');saveStep('Đã tạo hợp đồng ba bên; hãy ký trước khi thanh toán')}
else if(a==='pay'){if(!requireRole('user')||!requireMod('payment'))return;let enroll=state.enrollments.find(x=>x.courseId===id),course=state.courses.find(x=>x.id===id);if(!enroll||!enroll.signed||enroll.paid||!course)return toast('Không thể thanh toán: trạng thái hợp đồng không hợp lệ.','bad');enroll.paid=true;enroll.fee=Math.round(course.price*state.limits.commission/100);enroll.paidAt=new Date().toISOString();log('Thanh toán ảo '+money(course.price)+' · hoa hồng '+money(enroll.fee));saveStep('Thanh toán thử thành công, đã ghi nhận hoa hồng '+money(enroll.fee))}
else if(a==='fix-report'){if(!requireRole('admin'))return;showFixForm(id)}
else if(a==='approve-post'||a==='reject-post'){if(!requireRole('admin'))return;let post=state.posts.find(x=>x.id===id);if(!post)return;post.status=a==='approve-post'?'approved':'rejected';log('Kiểm duyệt: '+(post.status==='approved'?'Duyệt ':'Từ chối ')+post.title);saveStep('Đã cập nhật trạng thái bài viết')}
else if(a==='export-food')exportFoodCsv();
else if(a==='export')exportReport();
else if(a==='reset'){if(!confirm('Xóa toàn bộ dữ liệu demo trong trình duyệt và đặt lại sandbox?'))return;state=initState();scannerImage='';localStorage.removeItem('themeal-sandbox-v1');render();toast('Đã đặt lại môi trường sandbox')}
});

document.addEventListener('submit',e=>{const form=e.target;e.preventDefault();const fd=new FormData(form);const val=k=>(fd.get(k)||'').toString().trim();const num=k=>Number(val(k));
if(form.id==='rulesForm'){if(num('free')<1)return toast('Giới hạn Free phải từ 1 trở lên.','bad');state.limits={free:num('free'),platform:num('platform'),commission:num('commission')};log('Lưu cấu hình Freemium / phí nền tảng');saveStep('Đã cập nhật thông số kinh doanh')}
else if(form.id==='profileForm'){if(!requireRole('user')||!requireMod('db'))return;state.user={name:val('name'),age:num('age'),sex:val('sex'),height:num('height'),weight:num('weight'),goal:val('goal'),activity:val('activity')};log('Khởi tạo hồ sơ người dùng '+state.user.name);saveStep('Đã tính BMI, calo và macro từ hồ sơ')}
else if(form.id==='fridgeForm'){if(fridgeAdd({name:val('name'),qty:num('qty'),mfg:val('mfg'),exp:val('exp'),notify:num('notify')}))saveStep('Đã thêm '+val('name')+' vào tủ lạnh')}
else if(form.id==='chatForm'){const q=val('message');state.chat.push({role:'me',text:q},{role:'bot',text:miuAnswer(q)});state.chat=state.chat.slice(-24);save();render()}
else if(form.id==='expertForm'){if(!requireRole('expert')||!requireMod('db'))return;const certificate=selectedCert||state.expert.certificate;if(!certificate)return toast('Vui lòng tải lên file chứng chỉ minh họa trước.','warn');state.expert={name:val('name'),specialty:val('specialty'),certificate,status:'pending',signed:false};log('Chuyên gia gửi hồ sơ chứng chỉ '+certificate);saveStep('Đã gửi hồ sơ chờ quản trị viên duyệt')}
else if(form.id==='expertSignForm'){if(!requireRole('expert')||!requireMod('sign'))return;if(val('signature').toLocaleLowerCase('vi')!==state.expert.name.toLocaleLowerCase('vi'))return toast('Tên ký cần trùng tên chuyên gia trên hồ sơ.','warn');state.expert.signed=true;log('Chuyên gia xác nhận hợp đồng điện tử (demo)');saveStep('Hợp đồng mô phỏng đã được xác nhận')}
else if(form.id==='courseForm'){if(!requireRole('expert')||!requireMod('payment')||!state.expert.signed)return;const price=num('price'),name=val('name'),fee=Math.round(price*state.limits.platform/100);state.courses.push({id:'c'+Date.now(),name,price,fee,created:new Date().toISOString()});log('Đăng khóa học '+name+' · phí '+money(fee));saveStep('Đã đăng khóa học và ghi nhận phí nền tảng '+money(fee))}
else if(form.id==='learnerSignForm'){if(!requireRole('user')||!requireMod('sign'))return;let enroll=state.enrollments.find(x=>!x.signed);if(!enroll)return;enroll.signed=true;enroll.signature=val('signature');log('Học viên ký hợp đồng 3 bên (demo)');saveStep('Đã ký hợp đồng mô phỏng. Có thể thanh toán thử')}
else if(form.id==='postForm'){const title=val('title');state.posts.unshift({id:'p'+Date.now(),title,author:'Người dùng thử nghiệm',status:'pending'});log('Đăng bài cộng đồng chờ kiểm duyệt');saveStep('Đã tạo bài viết chờ quản trị viên duyệt')}
else if(form.id==='editFoodForm'){if(!requireRole('admin'))return;const name=document.getElementById('foodEditSelect').value;state.overrides[name]={cal:num('cal'),protein:num('protein'),carb:num('carb'),fat:num('fat')};log('Admin chỉnh dữ liệu món '+name);saveStep('Đã cập nhật dữ liệu món ăn mô phỏng')}
else if(form.id==='fixForm'){if(!requireRole('admin'))return;const r=state.reports.find(x=>x.id===val('reportId'));if(!r)return;state.overrides[r.food]={cal:num('cal'),protein:num('protein'),carb:num('carb'),fat:num('fat')};r.status='resolved';delete state.fixOpen;log('Admin đã hiệu chỉnh báo cáo '+r.food);saveStep('Đã lưu dữ liệu thực phẩm mới và đóng báo cáo')}
});
document.addEventListener('change',e=>{if(e.target.id==='roleSelect'){state.role=e.target.value;save();render();toast('Đang đóng vai: '+roleNames[state.role])}else if(e.target.matches('[data-module]')){const id=e.target.dataset.module;state.modules[id]=e.target.checked;log((state.modules[id]?'Kích hoạt ':'Tắt ')+'mô-đun '+id);save();render();toast('Đã cập nhật trạng thái phân hệ '+id)}else if(e.target.id==='foodEditSelect')fillFoodEditor();else if(e.target.id==='foodPhoto'){let f=e.target.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>4*1024*1024){toast('Chỉ hỗ trợ JPG/PNG/WebP tối đa 4MB.','warn');return}const reader=new FileReader();reader.onload=()=>{scannerImage=reader.result;render();toast('Đã tải ảnh lên giao diện demo')};reader.readAsDataURL(f)}else if(e.target.id==='certFile'){selectedCert=e.target.files[0]?.name||'';toast('Đã chọn tệp: '+selectedCert)}});
document.addEventListener('input',e=>{if(e.target.id==='foodSearch')searchFoods(e.target.value)});
document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('show'));
render();
</script>
</body>
</html>
